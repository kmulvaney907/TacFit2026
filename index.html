<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  /* Surfaces — warm coyote tan canvas, light enough for dark text */
  --bg:        #c4ad7e;
  --bg-alt:    #b8a173;
  --surface-1: #d8c69a;
  --surface-2: #e2d3ad;
  --surface-3: #ecdfbd;
  --line:      #8a7a55;
  --line-soft: #a89472;

  /* Ink — deep, readable on tan (all AA+ on bg) */
  --ink-1: #1c160a;   /* primary text */
  --ink-2: #3a2f1a;   /* secondary */
  --ink-3: #5a4a2a;   /* tertiary / labels */
  --ink-mute: #7a6840;

  /* Accent — deep olive-tan ink */
  --accent:    #4a3d1a;
  --accent-hi: #5e4d22;

  /* Status — readable on tan and white */
  --ok:       #2d5016;
  --ok-bg:    #b8d090;
  --warn:     #7a4a08;
  --warn-bg:  #e8c878;
  --alert:    #6b1f14;
  --alert-bg: #d89a8a;

  --font-display: 'Oswald', 'Bebas Neue', Impact, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --shadow-sm: 0 1px 0 rgba(28,22,10,.08), 0 1px 2px rgba(28,22,10,.06);
  --shadow-inset: inset 0 1px 0 rgba(255,248,228,.35);
}

html,body{
  height:100%;background:var(--bg);color:var(--ink-1);
  font-family:var(--font-body);font-size:15px;line-height:1.45;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

/* Subtle paper texture */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    radial-gradient(rgba(28,22,10,.04) 1px, transparent 1px),
    radial-gradient(rgba(255,248,228,.05) 1px, transparent 1px);
  background-size:14px 14px, 22px 22px;
  background-position:0 0, 7px 11px;
  z-index:0;
}

/* Layout */
.app{display:flex;flex-direction:column;height:100%;height:-webkit-fill-available;position:relative;z-index:1}
.screen{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:96px}
.screen.active{display:block}

/* Header — logo-led, bigger, centered */
.header{
  padding:max(env(safe-area-inset-top),12px) 16px 14px;
  display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:10px;
  background:linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:100;flex-shrink:0;
  box-shadow:0 1px 0 rgba(255,248,228,.4) inset;
  position:relative;
}
/* Subtle horizontal hairline accent under the header */
.header::after{
  content:'';position:absolute;left:16px;right:16px;bottom:-1px;height:2px;
  background:linear-gradient(90deg,
    transparent 0%,
    var(--line) 20%,
    var(--accent) 50%,
    var(--line) 80%,
    transparent 100%);
  opacity:.6;
}
.header-back{
  display:none;align-items:center;gap:6px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:7px 11px;
  font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.08em;
  color:var(--ink-1);cursor:pointer;text-transform:uppercase;
  justify-self:start;
}
.header-back:active{background:var(--surface-3)}
.header-back.visible{display:inline-flex}
.header-back svg{width:13px;height:13px}

.brand{
  display:flex;align-items:center;gap:11px;
  grid-column:2;justify-content:center;
}
.brand-logo{
  width:44px;height:44px;border-radius:10px;
  background:#0a0805;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  box-shadow:
    0 1px 0 rgba(255,248,228,.18) inset,
    0 0 0 1px rgba(28,22,10,.4),
    0 2px 6px rgba(28,22,10,.22);
  position:relative;
}
.brand-logo::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg, rgba(255,248,228,.08) 0%, transparent 50%);
}
.brand-logo img{
  width:100%;height:100%;object-fit:cover;display:block;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
.brand-text{display:flex;flex-direction:column;gap:1px;line-height:1}
.brand-name{
  font-family:var(--font-display);font-size:24px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-1);
  line-height:1;
}
.brand-name em{font-style:normal;color:var(--accent);font-weight:700}
.brand-tag{
  font-family:var(--font-mono);font-size:9px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);margin-top:3px;
}

/* Bottom Nav */
.bottom-nav{
  display:flex;background:var(--surface-1);border-top:1px solid var(--line);
  padding:0 0 max(env(safe-area-inset-bottom),6px);
  flex-shrink:0;position:relative;z-index:100;
  box-shadow:0 -1px 0 rgba(255,248,228,.4) inset, 0 -4px 12px rgba(28,22,10,.06);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 5px;background:none;border:none;cursor:pointer;
  color:var(--ink-3);font-family:var(--font-display);
  border-top:2px solid transparent;transition:color .15s;
}
.nav-btn.active{color:var(--ink-1);border-top-color:var(--accent)}
.nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}

/* Eyebrow labels (universal) */
.eyebrow{
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;
}
.eyebrow::before{
  content:'';display:inline-block;width:14px;height:1px;
  background:var(--ink-3);vertical-align:middle;margin-right:8px;margin-bottom:2px;
}

/* Readiness */
.readiness-strip{
  padding:12px 16px 14px;background:var(--bg-alt);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:90;
}
.readiness-label{margin-bottom:9px}
.readiness-btns{display:flex;gap:8px}
.r-btn{
  flex:1;padding:11px 6px 10px 28px;
  border-radius:var(--r-md);border:1.5px solid var(--line);
  background:var(--surface-2);
  font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.1em;
  color:var(--ink-2);cursor:pointer;transition:all .15s;text-transform:uppercase;
  position:relative;
}
.r-btn::before{
  content:'';position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .15s;
}
.r-btn.active-green{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.r-btn.active-green::before{background:var(--ok);box-shadow:0 0 0 3px rgba(45,80,22,.18)}
.r-btn.active-yellow{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.r-btn.active-yellow::before{background:var(--warn);box-shadow:0 0 0 3px rgba(122,74,8,.18)}
.r-btn.active-red{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.r-btn.active-red::before{background:var(--alert);box-shadow:0 0 0 3px rgba(107,31,20,.18)}

/* Today Hero */
.today-hero{padding:22px 18px 16px}
.today-hero .eyebrow{margin-bottom:8px}
.hero-week{
  font-family:var(--font-display);font-size:48px;font-weight:700;
  line-height:.95;letter-spacing:-.01em;
  text-transform:uppercase;color:var(--ink-1);
}
.hero-week .num{color:var(--accent);font-size:64px}
.hero-phase{font-size:14px;color:var(--ink-2);margin-top:6px;font-weight:500}
.hero-phase strong{color:var(--ink-1);font-weight:700}

.progress-bar-wrap{margin-top:18px}
.progress-bar-track{
  height:6px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(28,22,10,.12);
}
.progress-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));
  border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);
}
.progress-label{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-2);
  margin-top:8px;font-weight:500;display:flex;justify-content:space-between;
}

/* Week Scrubber */
.week-scrubber{
  display:flex;gap:7px;padding:14px 16px 18px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.week-scrubber::-webkit-scrollbar{display:none}
.wk-pill{
  flex-shrink:0;padding:7px 13px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--line-soft);
  font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.1em;
  color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.wk-pill:active{background:var(--surface-3)}
.wk-pill.active{background:var(--ink-1);border-color:var(--ink-1);color:var(--bg)}

.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px}

/* Session Cards */
.session-cards{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.session-card{
  background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.session-card:active{transform:translateY(1px);box-shadow:none}
.session-card-inner{display:flex;align-items:stretch}
.session-badge{
  width:62px;flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  background:var(--ink-1);padding:14px 8px;position:relative;
}
.session-badge::after{
  content:'';position:absolute;right:-1px;top:14px;bottom:14px;
  width:1px;background:var(--line);
}
.session-badge.completed{background:var(--ok)}
.badge-letter{
  font-family:var(--font-display);font-size:30px;font-weight:700;
  color:var(--bg);letter-spacing:-.02em;line-height:1;
}
.session-badge.completed .badge-letter{color:#fff}
.badge-word{
  font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.14em;
  color:rgba(196,173,126,.7);text-transform:uppercase;margin-top:2px;
}
.session-badge.completed .badge-word{color:rgba(255,255,255,.7)}
.session-body{flex:1;padding:13px 14px 11px;min-width:0}
.session-title{
  font-family:var(--font-display);font-size:17px;font-weight:600;
  color:var(--ink-1);letter-spacing:.005em;text-transform:uppercase;
  margin-bottom:3px;line-height:1.15;
}
.session-equip{font-size:12px;color:var(--ink-2);line-height:1.35;font-weight:500}
.session-meta{
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  flex-shrink:0;padding:13px 14px 11px 4px;
}
.session-duration{text-align:right;line-height:1}
.session-duration .num{
  font-family:var(--font-display);font-size:26px;font-weight:700;
  color:var(--ink-1);letter-spacing:-.02em;
}
.session-duration .unit{
  font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase;margin-left:2px;
}
.completion-ring{width:34px;height:34px;position:relative}
.completion-ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--line-soft);stroke-width:3}
.ring-fill{
  fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
  transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);
  transform:rotate(-90deg);transform-origin:50% 50%;
}
.ring-fill.done{stroke:var(--ok)}
.ring-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--ink-1);
}
.session-action-bar{
  padding:10px 14px 12px;border-top:1px dashed var(--line-soft);margin-top:2px;
}
.session-action-btn{
  width:100%;padding:9px;border-radius:var(--r-sm);border:1px solid var(--line);
  font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;background:var(--surface-2);color:var(--ink-1);
  transition:background .12s;
}
.session-action-btn:active{background:var(--surface-3)}
.session-action-btn.completed-btn{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

/* Easy Day */
.easy-wrap{padding:0 16px}
.easy-day{
  background:var(--surface-1);border:1.5px solid var(--alert);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-sm);
}
.easy-header{
  background:var(--alert);padding:14px 16px 12px;
  border-bottom:1px solid rgba(28,22,10,.2);
}
.easy-title{
  font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:.01em;
  color:#fff;text-transform:uppercase;line-height:1;
}
.easy-sub{
  font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  color:rgba(255,255,255,.85);text-transform:uppercase;margin-top:5px;
}
.easy-note{
  padding:13px 16px;font-size:13px;color:var(--ink-1);line-height:1.5;
  border-bottom:1px solid var(--line-soft);background:var(--surface-2);
}
.easy-options{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.easy-opt{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 14px;background:var(--surface-2);border:1.5px solid var(--line);
  border-radius:var(--r-md);cursor:pointer;transition:all .15s;
}
.easy-opt:active{background:var(--surface-3)}
.easy-opt.selected{
  border-color:var(--alert);background:var(--surface-3);
  box-shadow:0 0 0 3px rgba(107,31,20,.12);
}
.easy-opt-name{
  font-family:var(--font-display);font-size:15px;font-weight:600;
  color:var(--ink-1);text-transform:uppercase;letter-spacing:.02em;
}
.easy-opt-detail{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.easy-opt-dur{text-align:right;line-height:1}
.easy-opt-dur .n{
  font-family:var(--font-display);font-size:22px;font-weight:700;
  color:var(--ink-1);letter-spacing:-.02em;
}
.easy-opt-dur .u{
  font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--ink-3);display:block;text-transform:uppercase;
}
.easy-sel-btn{
  margin-top:4px;width:100%;padding:13px;border-radius:var(--r-md);border:none;
  background:var(--alert);color:#fff;
  font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;transition:background .12s;
}
.easy-sel-btn:active{background:#5a1a10}

/* Session Detail */
.session-detail{padding:18px 18px 0}
.detail-breadcrumb{margin-bottom:8px}
.detail-title{
  font-family:var(--font-display);font-size:30px;font-weight:600;
  letter-spacing:.005em;line-height:1.05;color:var(--ink-1);text-transform:uppercase;
  margin-bottom:6px;
}
.detail-equip{font-size:13px;color:var(--ink-2);margin-bottom:14px;font-weight:500}
.detail-pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.detail-pill{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:6px 11px;font-family:var(--font-mono);font-size:11px;font-weight:600;
  color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
}
.detail-pill span{
  font-family:var(--font-display);color:var(--ink-1);font-weight:600;
  font-size:13px;letter-spacing:.02em;
}

.detail-actions{display:flex;gap:8px;margin-bottom:20px}
.btn-reset{
  padding:11px 16px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--surface-2);font-family:var(--font-display);
  font-size:12px;font-weight:600;letter-spacing:.12em;
  color:var(--ink-1);cursor:pointer;text-transform:uppercase;
}
.btn-reset:active{background:var(--surface-3)}
.btn-mark-complete{
  flex:1;padding:11px 16px;border-radius:var(--r-md);
  border:1px solid var(--ink-1);background:var(--ink-1);
  font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.12em;
  color:var(--bg);cursor:pointer;text-transform:uppercase;
  box-shadow:var(--shadow-inset);
}
.btn-mark-complete:active{background:#0e0a05}
.btn-mark-complete.done{background:var(--ok);border-color:var(--ok);color:#fff}

/* Operator Note */
.op-banner{
  position:relative;padding:14px 16px 14px 20px;margin-bottom:20px;
  font-size:13.5px;color:var(--ink-1);line-height:1.55;
  background:var(--surface-2);border:1px solid var(--line);border-left:none;
  border-radius:0 var(--r-md) var(--r-md) 0;
}
.op-banner::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);
}
.op-banner::after{
  content:'OPERATOR NOTE';position:absolute;top:-7px;left:14px;
  background:var(--bg);padding:0 6px;
  font-family:var(--font-mono);font-size:9px;font-weight:700;
  letter-spacing:.16em;color:var(--ink-3);
}

/* Exercise Blocks */
.block-section{margin-bottom:20px}
.block-header{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.block-tag{
  font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;background:var(--ink-1);border-radius:var(--r-sm);
  padding:5px 10px;color:var(--bg);
}
.block-subtitle{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-3);letter-spacing:.12em;
  font-weight:600;text-transform:uppercase;
}

.ex-rows{
  background:var(--surface-1);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;
}
.ex-row{
  display:flex;align-items:center;gap:13px;padding:13px 14px;
  border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .1s;
}
.ex-row:last-child{border-bottom:none}
.ex-row:active{background:var(--surface-2)}
.ex-check{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--surface-2);transition:all .2s;
}
.ex-check.checked{background:var(--ok);border-color:var(--ok)}
.ex-check svg{display:none;width:14px;height:14px;color:#fff}
.ex-check.checked svg{display:block}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14.5px;font-weight:600;color:var(--ink-1);margin-bottom:1px;line-height:1.25}
.ex-name.checked-name{color:var(--ink-mute);text-decoration:line-through;font-weight:500}
.ex-cue{font-size:12px;color:var(--ink-2);line-height:1.35}
.ex-reps{text-align:right;flex-shrink:0;min-width:54px}
.ex-reps .sets{
  font-family:var(--font-display);font-size:15px;font-weight:600;
  color:var(--ink-1);letter-spacing:.005em;
}

/* Conditioning */
.cond-options{display:flex;flex-direction:column;gap:9px}
.cond-opt{
  background:var(--surface-1);border:1.5px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;cursor:pointer;transition:all .15s;
}
.cond-opt.selected{
  border-color:var(--accent);background:var(--surface-2);
  box-shadow:0 0 0 3px rgba(74,61,26,.12);
}
.cond-opt-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.cond-opt-name{
  font-family:var(--font-display);font-size:15px;font-weight:600;
  color:var(--ink-1);text-transform:uppercase;letter-spacing:.02em;
}
.cond-sel-btn{
  padding:6px 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--bg);font-family:var(--font-display);
  font-size:11px;font-weight:600;letter-spacing:.12em;
  color:var(--ink-2);cursor:pointer;text-transform:uppercase;transition:all .15s;
}
.cond-sel-btn.selected{background:var(--ink-1);border-color:var(--ink-1);color:var(--bg)}
.cond-prescription{padding:0 14px 13px;font-size:13.5px;color:var(--ink-1);line-height:1.5}
.cond-level-tag{
  display:inline-block;font-family:var(--font-mono);font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:6px;padding:3px 7px;border-radius:var(--r-sm);border:1px solid currentColor;
}
.cond-level-tag.green{color:var(--ok);background:var(--ok-bg)}
.cond-level-tag.yellow{color:var(--warn);background:var(--warn-bg)}
.cond-level-tag.red{color:var(--alert);background:var(--alert-bg)}

/* Programme */
.prog-screen{padding:18px}
.section-label{margin-bottom:14px;display:block}
.phase-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.phase-card{
  border-radius:var(--r-lg);padding:20px 18px;cursor:pointer;
  display:flex;align-items:flex-start;gap:14px;
  position:relative;overflow:hidden;
  border:1px solid var(--line);background:var(--surface-1);
  box-shadow:var(--shadow-sm);transition:transform .15s, box-shadow .15s;
}
.phase-card:active{transform:translateY(1px);box-shadow:none}
.phase-card.p1{border-top:4px solid var(--ok)}
.phase-card.p2{border-top:4px solid var(--accent)}
.phase-card.p3{border-top:4px solid var(--warn)}
.phase-num{
  font-family:var(--font-display);font-size:62px;font-weight:700;
  line-height:.85;letter-spacing:-.04em;flex-shrink:0;margin-top:-4px;
}
.phase-card.p1 .phase-num{color:rgba(45,80,22,.22)}
.phase-card.p2 .phase-num{color:rgba(74,61,26,.22)}
.phase-card.p3 .phase-num{color:rgba(122,74,8,.22)}
.phase-info{flex:1;min-width:0}
.phase-eyebrow{
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;
  color:var(--ink-3);text-transform:uppercase;margin-bottom:4px;
}
.phase-name{
  font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:.01em;
  color:var(--ink-1);text-transform:uppercase;line-height:1;
}
.phase-desc{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:6px;font-weight:500}
.phase-wk{
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase;text-align:right;flex-shrink:0;
}
.phase-wk span{
  display:block;font-family:var(--font-display);font-size:22px;font-weight:600;
  color:var(--ink-1);letter-spacing:0;margin-top:2px;
}

/* Progress */
.prog-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:18px 18px 0}
.stat-tile{
  background:var(--surface-1);border:1px solid var(--line);
  border-radius:var(--r-md);padding:14px;position:relative;overflow:hidden;
}
.stat-tile::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);
}
.stat-label{
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;
}
.stat-value{
  font-family:var(--font-display);font-size:40px;font-weight:700;
  color:var(--ink-1);line-height:1;letter-spacing:-.02em;
}
.stat-sub{font-size:11px;color:var(--ink-2);margin-top:4px;font-weight:500}

.phase-progress{padding:18px}
.phase-prog-card{
  background:var(--surface-1);border:1px solid var(--line);
  border-radius:var(--r-md);padding:14px;margin-bottom:8px;
}
.phase-prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.phase-prog-name{
  font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.06em;
  color:var(--ink-1);text-transform:uppercase;
}
.phase-prog-pct{
  font-family:var(--font-display);font-size:18px;font-weight:600;
  color:var(--ink-1);letter-spacing:-.01em;
}
.phase-prog-track{
  height:6px;background:var(--surface-3);border:1px solid var(--line-soft);
  border-radius:3px;overflow:hidden;
}
.phase-prog-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.phase-prog-fill.p1{background:var(--ok)}
.phase-prog-fill.p2{background:var(--accent)}
.phase-prog-fill.p3{background:var(--warn)}

.recent-sessions{padding:0 18px 18px}
.recent-list{
  background:var(--surface-1);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;
}
.recent-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-bottom:1px solid var(--line-soft);
}
.recent-item:last-child{border-bottom:none}
.recent-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  flex-shrink:0;box-shadow:0 0 0 3px rgba(74,61,26,.15);
}
.recent-info{flex:1;min-width:0}
.recent-name{
  font-size:13.5px;font-weight:600;color:var(--ink-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recent-meta{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-3);
  margin-top:2px;letter-spacing:.04em;
}
.recent-time{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-3);
  flex-shrink:0;font-weight:600;letter-spacing:.04em;text-align:right;
}
.empty-state{text-align:center;padding:32px 20px;color:var(--ink-3);font-size:13px;font-style:italic}

@media (max-width: 360px){
  .brand{gap:9px}
  .brand-logo{width:40px;height:40px}
  .brand-name{font-size:21px}
  .brand-tag{font-size:8px}
}
/* When back button visible, tighten brand a touch */
.header-back.visible ~ .brand .brand-tag{display:none}
.header-back.visible ~ .brand .brand-logo{width:38px;height:38px;border-radius:9px}
.header-back.visible ~ .brand .brand-name{font-size:21px}
</style>
</head>

sive"}],"operator_notes":"Near-max bench equivalent. These are strength expression days."},{"day":3,"label":"Lower + Endurance","strength":[{"exercise":"Romanian Deadlift","prescription":"4x5","load":"near max"},{"exercise":"Bulgarian Split Squat","prescription":"4x5 each leg","load":"heavy"},{"exercise":"Step-Up","prescription":"4x10 each leg","load":"vest + DBs"}],"conditioning":{"A":{"name":"Assault Bike","green":"35 min steady Zone 2","yellow":"25 min easy","red":"12 min very easy"},"B":{"name":"Hill Walk","green":"65 min — beat your Wk9 time if possible","yellow":"45 min moderate","red":"20 min flat"}},"carries":[{"exercise":"Suitcase Carry","prescription":"6x50 yds each side","load":"peak load"}],"operator_notes":"Match or beat Week 9 endurance output. You're peaking — trust the process."},{"day":4,"label":"Full Body + Peak Intervals","strength":[{"exercise":"Trap Bar Deadlift","prescription":"3x2","load":"87.5%"},{"exercise":"Push-Up","prescription":"5x25","load":"weighted vest"},{"exercise":"Ring Row","prescription":"5x10","load":"peak load"}],"conditioning":{"A":{"name":"Assault Bike","green":"12 rounds: 90 sec hard / 90 sec easy — peak output","yellow":"7 rounds: 1 min moderate / 90 sec easy","red":"10 min easy"},"B":{"name":"Hill Walk","green":"60 min — 3 min hard / 2 min easy x10 then cooldown","yellow":"40 min steady","red":"20 min flat"}},"carries":[{"exercise":"KB Swing","prescription":"5x20","load":"same or heavier than Wk9"}],"operator_notes":"12 intervals is the peak conditioning volume of the program. Max sustainable effort."}]},{"week":11,"block":"Peak — Taper","days":[{"day":1,"label":"Strength Taper — Hinge + Pull","strength":[{"exercise":"Trap Bar Deadlift","prescription":"3x3","load":"80%"},{"exercise":"Barbell Row","prescription":"3x5","load":"moderate-heavy"},{"exercise":"Weighted Pull-Up","prescription":"3x3","load":"+20 lbs"}],"conditioning":{"A":{"name":"Assault Bike","green":"5 rounds: 50 sec hard / 80 sec easy","yellow":"4 rounds: 40 sec moderate / 90 sec easy","red":"10 min easy"},"B":{"name":"Hill Walk","green":"35 min — strong but not maximal effort","yellow":"25 min moderate","red":"15 min flat"}},"carries":[{"exercise":"Farmer Carry","prescription":"4x45 yds","load":"slightly reduced load"}],"operator_notes":"Taper week — reduce volume, maintain intensity. You are priming, not building."},{"day":2,"label":"Strength Taper — Press","strength":[{"exercise":"Floor Press","prescription":"3x3","load":"80%"},{"exercise":"Push Press","prescription":"3x4","load":"moderate"},{"exercise":"Weighted Dip","prescription":"3x5","load":"+20 lbs"}],"conditioning":{"A":{"name":"Assault Bike","green":"5 rounds: 40 sec sprint / 85 sec easy","yellow":"4 rounds: 30 sec moderate / 90 sec easy","red":"8 min easy"},"B":{"name":"Hill Walk","green":"30 min — controlled effort","yellow":"22 min moderate","red":"15 min flat"}},"carries":[{"exercise":"Sandbag Shouldering","prescription":"3x5","load":"same load — stay sharp"}],"operator_notes":"Same intensity, less volume. Your body retains strength — trust the taper."},{"day":3,"label":"Lower Taper","strength":[{"exercise":"Romanian Deadlift","prescription":"3x5","load":"moderate-heavy"},{"exercise":"Bulgarian Split Squat","prescription":"3x5 each leg","load":"moderate"},{"exercise":"Step-Up","prescription":"3x8 each leg","load":"vest or DBs"}],"conditioning":{"A":{"name":"Assault Bike","green":"20 min steady Zone 2 — maintenance","yellow":"15 min easy","red":"10 min very easy"},"B":{"name":"Hill Walk","green":"35 min easy to moderate","yellow":"25 min easy","red":"15 min flat"}},"carries":[{"exercise":"Suitcase Carry","prescription":"4x40 yds each side","load":"reduced load"}],"operator_notes":"Reduce conditioning volume. Quality movement at pace — not a grind."},{"day":4,"label":"Full Body Taper","strength":[{"exercise":"Trap Bar Deadlift","prescription":"3x3","load":"77.5%"},{"exercise":"Push-Up","prescription":"3x20","load":"weighted vest"},{"exercise":"Ring Row","prescription":"3x10","load":"moderate load"}],"conditioning":{"A":{"name":"Assault Bike","green":"5 rounds: 1 min hard / 1 min easy","yellow":"4 rounds: 45 sec moderate / 1 min easy","red":"10 min easy"},"B":{"name":"Hill Walk","green":"35 min — moderate effort, no max push","yellow":"25 min easy","red":"15 min flat"}},"carries":[{"exercise":"KB Swing","prescription":"4x15","load":"moderate — stay crisp"}],"operator_notes":"Half the intervals from peak week. Arrive at Week 12 fresh and primed."}]},{"week":12,"block":"Peak — Test Week","days":[{"day":1,"label":"Strength Test — Hinge + Pull","strength":[{"exercise":"Trap Bar Deadlift — 1RM Attempt","prescription":"1x1","load":"3–5% above previous best"},{"exercise":"Barbell Row — Heavy 3","prescription":"1x3","load":"heaviest manageable"},{"exercise":"Max Pull-Ups — Unbroken","prescription":"1 set","load":"bodyweight"}],"conditioning":{"A":{"name":"Assault Bike","green":"3 rounds: 1 min max effort — record output","yellow":"3 rounds easy — don't test today","red":"10 min easy — test another day"},"B":{"name":"Hill Walk","green":"20 min — timed hill repeat: best 400m uphill effort","yellow":"20 min easy walk","red":"15 min flat walk"}},"carries":[{"exercise":"Farmer Carry — Max Load Test","prescription":"1x50 yds","load":"heaviest manageable"}],"operator_notes":"Test day — attempt PRs. Opener at 90%, then go. Document everything."},{"day":2,"label":"Strength Test — Press","strength":[{"exercise":"Floor Press — 1RM Attempt","prescription":"1x1","load":"3–5% above previous best"},{"exercise":"Weighted Dip — Heavy 3","prescription":"1x3","load":"max load"},{"exercise":"Max Push-Ups — 2 min","prescription":"1 set","load":"bodyweight — record count"}],"conditioning":{"A":{"name":"Assault Bike","green":"3 rounds: 1 min max effort — record watts/output","yellow":"3 rounds easy","red":"10 min easy"},"B":{"name":"Hill Walk","green":"20 min — timed hill repeat test","yellow":"20 min easy walk","red":"15 min flat"}},"carries":[{"exercise":"Sandbag Shouldering — Max Load","prescription":"3 reps","load":"heaviest possible"}],"operator_notes":"Document all results. Compare to Week 1 for program ROI."},{"day":3,"label":"Tactical Fitness Test","strength":[{"exercise":"Weighted Pull-Up — Max Load","prescription":"1x3","load":"heaviest possible"},{"exercise":"Push Press — Heavy 3","prescription":"1x3","load":"max load"},{"exercise":"KB Swing — Heavy 10","prescription":"1x10","load":"max KB — power output"}],"conditioning":{"A":{"name":"Assault Bike","green":"5 min max effort — record total calories/distance","yellow":"5 min moderate effort","red":"5 min easy effort"},"B":{"name":"Hill Walk","green":"Timed hill: best effort up a fixed climb — record time","yellow":"Moderate 20 min walk","red":"15 min flat"}},"carries":[{"exercise":"Suitcase Carry — Max Load Test","prescription":"1x50 yds each side","load":"heaviest manageable"}],"operator_notes":"Tactical battery — record all times and loads. This is your fitness report card."},{"day":4,"label":"Program Close — Full Assessment","strength":[{"exercise":"Trap Bar Deadlift","prescription":"3x3","load":"80% — move well, feel the improvement"},{"exercise":"Floor Press","prescription":"3x3","load":"80%"},{"exercise":"Pull-Up","prescription":"3x max","load":"bodyweight — note total"}],"conditioning":{"A":{"name":"Assault Bike","green":"20 min Zone 2 — reflect on where you started","yellow":"15 min easy","red":"10 min easy"},"B":{"name":"Hill Walk","green":"30 min easy — compare effort to Week 1","yellow":"25 min easy","red":"20 min flat"}},"carries":[{"exercise":"Farmer Carry","prescription":"3x50 yds","load":"comfortable — program is complete"}],"operator_notes":"Program complete. Cycle into sustainment or restart Block 1 with new 1RM baselines."}]}]}}</script>

<script>
const PROGRAM_DATA = JSON.parse(document.getElementById('programData').textContent);
/* State */
const SK = {readiness:'tf.readiness',currentWeek:'tf.week',completed:'tf.completed',recentSessions:'tf.recent'};
let state = {screen:'today',prevScreen:null,readiness:'yellow',currentWeek:1,viewingWeek:1,sessionDetail:null,completed:{},recentSessions:[]};

function load(){
  state.readiness = localStorage.getItem(SK.readiness) || 'yellow';
  state.currentWeek = parseInt(localStorage.getItem(SK.currentWeek)) || 1;
  state.viewingWeek = state.currentWeek;
  state.completed = JSON.parse(localStorage.getItem(SK.completed) || '{}');
  state.recentSessions = JSON.parse(localStorage.getItem(SK.recentSessions) || '[]');
}
function save(){
  localStorage.setItem(SK.readiness, state.readiness);
  localStorage.setItem(SK.currentWeek, state.currentWeek);
  localStorage.setItem(SK.completed, JSON.stringify(state.completed));
  localStorage.setItem(SK.recentSessions, JSON.stringify(state.recentSessions));
}

const weeks = PROGRAM_DATA.program.weeks;
function getWeek(n){return weeks.find(w=>w.week===n)}
function sessionKey(w,d){return 'w'+w+'_d'+d}
function isSessionDone(w,d){return !!(state.completed[sessionKey(w,d)] && state.completed[sessionKey(w,d)].completedAt)}
function totalSessions(){return weeks.reduce((a,w)=>a+w.days.length,0)}
function doneSessions(){return Object.values(state.completed).filter(e=>e.completedAt).length}
function blockForWeek(n){
  if(n<=4) return {num:1,name:'Foundation',cls:'p1'};
  if(n<=8) return {num:2,name:'Build',cls:'p2'};
  return {num:3,name:'Peak',cls:'p3'};
}
function phasePct(b){
  const start = b===1?1:b===2?5:9;
  const end = b===1?4:b===2?8:12;
  let done=0,total=0;
  for(let w=start;w<=end;w++){
    const wk=getWeek(w);if(!wk)continue;
    wk.days.forEach(d=>{total++;if(isSessionDone(w,d.day))done++});
  }
  return total>0?Math.round(done/total*100):0;
}
function equipString(day){
  const all = day.strength.map(e=>e.load).concat(day.carries.map(e=>e.load)).join(' ');
  const exNames = day.strength.map(e=>e.exercise).join(' ');
  const tags=[];
  if(/trap bar/i.test(all)||/trap/i.test(day.label)) tags.push('Trap Bar');
  if(/barbell/i.test(all)) tags.push('Barbell');
  if(/KB|kettlebell/i.test(all)) tags.push('KB');
  if(/DB|dumbbell/i.test(all)) tags.push('DB');
  if(/pull.?up/i.test(exNames)) tags.push('Pull-ups');
  if(/ring/i.test(exNames)) tags.push('Rings');
  if(/sandbag/i.test(all)) tags.push('Sandbag');
  if(/vest/i.test(all)) tags.push('Vest');
  if(tags.length===0) tags.push('Bodyweight');
  return Array.from(new Set(tags)).join(' · ');
}
function sessionDuration(day){
  const exCount = day.strength.length + day.carries.length;
  return Math.min(70, Math.max(35, 20 + exCount*6 + (day.strength.some(e=>/5x|4x.*heavy/i.test(e.prescription))?10:0)));
}
function exCheckedCount(w,d){
  const e = state.completed[sessionKey(w,d)];
  return (e && e.exChecked) ? e.exChecked.length : 0;
}
function totalExCount(day){return day.strength.length + day.carries.length + 2}

/* Routing */
function switchScreen(name){
  if(name === state.screen && name !== 'session') return;
  state.prevScreen = state.screen;
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('screen-'+name).scrollTop = 0;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const navMap = {today:'navToday',programme:'navProgramme',progress:'navProgress'};
  if(navMap[name]) document.getElementById(navMap[name]).classList.add('active');
  document.getElementById('backBtn').classList.toggle('visible', name === 'session');
  if(name==='today') renderToday();
  if(name==='programme') renderProgramme();
  if(name==='progress') renderProgress();
  if(name==='session') renderSessionDetail();
}
function goBack(){switchScreen(state.prevScreen || 'today')}

/* Readiness */
function setReadiness(level){
  state.readiness = level;
  save();
  renderReadiness();
  renderEasyDayVisibility();
  if(state.screen==='session' && level !== 'red') renderSessionDetail();
}

const EASY_OPTIONS = [
  {name:'Assault Bike', detail:'Easy spin — conversational pace, nasal breathing', dur:25},
  {name:'Hill Walk', detail:'Flat to gentle grade — no effort, just move', dur:25},
  {name:'KB Flow', detail:'Light KB — halos, deadlifts, swings at 50% effort', dur:20},
  {name:'Mobility Walk', detail:'Walk + hip openers, thoracic rotation, band work', dur:20},
];
let easySelected = null;

function renderEasyDayVisibility(){
  const isRed = state.readiness === 'red';
  document.getElementById('easyDayCard').style.display = isRed ? 'block' : 'none';
  document.getElementById('sessionCards').style.display = isRed ? 'none' : 'flex';
  document.getElementById('sessionAreaLabel').textContent = isRed ? 'Easy Day Protocol' : 'Select Session';
  if(isRed) renderEasyOptions();
}
function renderEasyOptions(){
  const el = document.getElementById('easyOptions');
  el.innerHTML = EASY_OPTIONS.map((opt,i) =>
    '<div class="easy-opt'+(easySelected===i?' selected':'')+'" onclick="selectEasyOpt('+i+')">' +
      '<div><div class="easy-opt-name">'+opt.name+'</div><div class="easy-opt-detail">'+opt.detail+'</div></div>' +
      '<div class="easy-opt-dur"><div class="n">'+opt.dur+'</div><div class="u">min</div></div>' +
    '</div>'
  ).join('') + '<button class="easy-sel-btn" onclick="logEasyDay()">Log Easy Day</button>';
}
function selectEasyOpt(i){
  easySelected = easySelected === i ? null : i;
  renderEasyOptions();
}
function logEasyDay(){
  const opt = easySelected !== null ? EASY_OPTIONS[easySelected] : EASY_OPTIONS[0];
  state.recentSessions.unshift({
    label:'Easy Day — '+opt.name,
    meta:'Red Day · Week '+state.currentWeek,
    time: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
  });
  if(state.recentSessions.length>10) state.recentSessions.pop();
  save();
  const btn = document.querySelector('.easy-sel-btn');
  if(btn){btn.textContent='✓ Logged';btn.style.pointerEvents='none';btn.style.opacity='.7'}
}
function renderReadiness(){
  ['green','yellow','red'].forEach(l=>{
    const btn = document.getElementById('r'+l.charAt(0).toUpperCase()+l.slice(1));
    btn.className = 'r-btn' + (state.readiness===l ? ' active-'+l : '');
  });
}

/* Today */
function renderToday(){
  renderReadiness();
  renderHero();
  renderScrubber();
  renderSessionCards();
  renderEasyDayVisibility();
}
function renderHero(){
  const w = state.currentWeek;
  const bl = blockForWeek(w);
  const totalDone = doneSessions();
  const pct = Math.round(totalDone / totalSessions() * 100);
  document.getElementById('heroWeekNum').textContent = w;
  document.getElementById('heroPhase').innerHTML = 'Phase '+bl.num+' · <strong>'+bl.name+'</strong>';
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = 'Week '+w+' of 12';
  document.getElementById('progressPct').textContent = pct+'% Complete';
}
function renderScrubber(){
  const el = document.getElementById('weekScrubber');
  el.innerHTML = weeks.map(w =>
    '<div class="wk-pill'+(w.week===state.viewingWeek?' active':'')+'" onclick="selectWeek('+w.week+')">Wk '+w.week+'</div>'
  ).join('');
  setTimeout(()=>{
    const active = el.querySelector('.wk-pill.active');
    if(active) active.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  },50);
}
function selectWeek(n){
  state.viewingWeek = n;
  renderScrubber();
  renderSessionCards();
}
function renderSessionCards(){
  const week = getWeek(state.viewingWeek);
  if(!week){document.getElementById('sessionCards').innerHTML='';return}
  const letters = ['A','B','C','D','E','F'];
  const html = week.days.map((day,i) => {
    const done = isSessionDone(state.viewingWeek, day.day);
    const dayNum = day.day;
    const letter = letters[i];
    const equip = equipString(day);
    const dur = sessionDuration(day);
    const total = totalExCount(day);
    const checked = exCheckedCount(state.viewingWeek, dayNum);
    const pct = total>0?Math.round(checked/total*100):0;
    const circ = 2*Math.PI*14;
    const offset = circ - (pct/100)*circ;

    return ''+
    '<div class="session-card" onclick="openSession('+state.viewingWeek+','+dayNum+')">' +
      '<div class="session-card-inner">' +
        '<div class="session-badge'+(done?' completed':'')+'">' +
          '<div class="badge-letter">'+letter+'</div>' +
          '<div class="badge-word">Session</div>' +
        '</div>' +
        '<div class="session-body">' +
          '<div class="session-title">'+day.label+'</div>' +
          '<div class="session-equip">'+equip+'</div>' +
        '</div>' +
        '<div class="session-meta">' +
          '<div class="session-duration"><span class="num">'+dur+'</span><span class="unit">min</span></div>' +
          '<div class="completion-ring">' +
            '<svg viewBox="0 0 32 32">' +
              '<circle class="ring-bg" cx="16" cy="16" r="14"/>' +
              '<circle class="ring-fill'+(done?' done':'')+'" cx="16" cy="16" r="14" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/>' +
            '</svg>' +
            '<div class="ring-pct">'+pct+'%</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="session-action-bar">' +
        '<button class="session-action-btn'+(done?' completed-btn':'')+'" onclick="event.stopPropagation();openSession('+state.viewingWeek+','+dayNum+')">' +
          (done?'✓ Completed · View Session':'View Full Session') +
        '</button>' +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('sessionCards').innerHTML = html;
}

/* Session detail */
function openSession(weekNum, dayNum){
  const week = getWeek(weekNum);
  const day = week && week.days.find(d=>d.day===dayNum);
  if(!day) return;
  state.sessionDetail = {weekNum, dayNum, week, day};
  switchScreen('session');
}

function renderSessionDetail(){
  const sd = state.sessionDetail;
  const weekNum = sd.weekNum, dayNum = sd.dayNum, week = sd.week, day = sd.day;
  const bl = blockForWeek(weekNum);
  const done = isSessionDone(weekNum, dayNum);
  const key = sessionKey(weekNum, dayNum);
  const entry = state.completed[key] || {exChecked:[]};
  const total = totalExCount(day);
  const checked = (entry.exChecked || []).length;
  const pct = total>0?Math.round(checked/total*100):0;
  const dur = sessionDuration(day);
  const level = state.readiness;

  function exRow(exercise, idxPrefix){
    const id = key+'_'+idxPrefix;
    const isChecked = (entry.exChecked || []).indexOf(id) !== -1;
    return ''+
    '<div class="ex-row" onclick="toggleEx(\''+id+'\',\''+key+'\')">' +
      '<div class="ex-check'+(isChecked?' checked':'')+'" id="chk_'+id+'">' +
        '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</div>' +
      '<div class="ex-info">' +
        '<div class="ex-name'+(isChecked?' checked-name':'')+'" id="nm_'+id+'">'+exercise.exercise+'</div>' +
        '<div class="ex-cue">'+(exercise.load||'')+'</div>' +
      '</div>' +
      '<div class="ex-reps"><div class="sets">'+exercise.prescription+'</div></div>' +
    '</div>';
  }

  const strengthRows = day.strength.map((e,i)=>exRow(e,'s'+i)).join('');
  const carryRows = day.carries.map((e,i)=>exRow(e,'c'+i)).join('');

  const condA = day.conditioning.A, condB = day.conditioning.B;
  const selA = entry.condSelected==='A', selB = entry.condSelected==='B';
  const condAChecked = (entry.exChecked || []).indexOf(key+'_condA') !== -1;
  const condBChecked = (entry.exChecked || []).indexOf(key+'_condB') !== -1;

  const condHTML = ''+
  '<div class="cond-options">' +
    '<div class="cond-opt'+(selA?' selected':'')+'" id="condOptA_'+key+'">' +
      '<div class="cond-opt-top">' +
        '<div style="display:flex;align-items:center;gap:10px;flex:1">' +
          '<div class="ex-check'+(condAChecked?' checked':'')+'" onclick="event.stopPropagation();toggleEx(\''+key+'_condA\',\''+key+'\')" id="chk_'+key+'_condA">' +
            '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</div>' +
          '<div class="cond-opt-name">'+condA.name+'</div>' +
        '</div>' +
        '<button class="cond-sel-btn'+(selA?' selected':'')+'" onclick="selectCond(\'A\',\''+key+'\')" id="csBtnA_'+key+'">'+(selA?'Selected':'Select')+'</button>' +
      '</div>' +
      '<div class="cond-prescription"><div class="cond-level-tag '+level+'">'+level+' Day</div><br>'+condA[level]+'</div>' +
    '</div>' +
    '<div class="cond-opt'+(selB?' selected':'')+'" id="condOptB_'+key+'">' +
      '<div class="cond-opt-top">' +
        '<div style="display:flex;align-items:center;gap:10px;flex:1">' +
          '<div class="ex-check'+(condBChecked?' checked':'')+'" onclick="event.stopPropagation();toggleEx(\''+key+'_condB\',\''+key+'\')" id="chk_'+key+'_condB">' +
            '<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</div>' +
          '<div class="cond-opt-name">'+condB.name+'</div>' +
        '</div>' +
        '<button class="cond-sel-btn'+(selB?' selected':'')+'" onclick="selectCond(\'B\',\''+key+'\')" id="csBtnB_'+key+'">'+(selB?'Selected':'Select')+'</button>' +
      '</div>' +
      '<div class="cond-prescription"><div class="cond-level-tag '+level+'">'+level+' Day</div><br>'+condB[level]+'</div>' +
    '</div>' +
  '</div>';

  const html = ''+
    '<div class="eyebrow detail-breadcrumb">Phase '+bl.num+' · Week '+weekNum+' · '+(done?'Completed':'In Progress')+'</div>' +
    '<div class="detail-title">'+day.label+'</div>' +
    '<div class="detail-equip">'+equipString(day)+'</div>' +
    '<div class="detail-pills">' +
      '<div class="detail-pill"><span>'+dur+'</span> Min</div>' +
      '<div class="detail-pill"><span>'+checked+'/'+total+'</span> Exercises</div>' +
      '<div class="detail-pill"><span>'+pct+'%</span> Done</div>' +
    '</div>' +
    '<div class="detail-actions">' +
      '<button class="btn-reset" onclick="resetSession(\''+key+'\')">Reset</button>' +
      '<button class="btn-mark-complete'+(done?' done':'')+'" id="markCompleteBtn" onclick="markComplete(\''+key+'\','+weekNum+','+dayNum+')">'+(done?'✓ Completed':'Mark Complete')+'</button>' +
    '</div>' +
    '<div class="op-banner">'+day.operator_notes+'</div>' +
    '<div class="block-section">' +
      '<div class="block-header"><div class="block-tag">Strength</div><div class="block-subtitle">Main Lifts</div></div>' +
      '<div class="ex-rows">'+strengthRows+'</div>' +
    '</div>' +
    '<div class="block-section">' +
      '<div class="block-header"><div class="block-tag">Conditioning</div><div class="block-subtitle">Pick One</div></div>' +
      condHTML +
    '</div>' +
    '<div class="block-section">' +
      '<div class="block-header"><div class="block-tag">Carries</div><div class="block-subtitle">Tactical Loaded Work</div></div>' +
      '<div class="ex-rows">'+carryRows+'</div>' +
    '</div>';
  document.getElementById('sessionDetailContent').innerHTML = html;
}

function toggleEx(exId, sk){
  if(!state.completed[sk]) state.completed[sk] = {exChecked:[]};
  if(!state.completed[sk].exChecked) state.completed[sk].exChecked = [];
  const arr = state.completed[sk].exChecked;
  const idx = arr.indexOf(exId);
  if(idx===-1) arr.push(exId); else arr.splice(idx,1);
  save();
  const chk = document.getElementById('chk_'+exId);
  const nm = document.getElementById('nm_'+exId);
  const isNow = arr.indexOf(exId) !== -1;
  if(chk) chk.classList.toggle('checked', isNow);
  if(nm) nm.classList.toggle('checked-name', isNow);
  updateDetailPills(sk);
}
function updateDetailPills(key){
  const entry = state.completed[key] || {exChecked:[]};
  const day = state.sessionDetail.day;
  const total = totalExCount(day);
  const checked = (entry.exChecked || []).length;
  const pct = total>0?Math.round(checked/total*100):0;
  const pills = document.querySelectorAll('.detail-pill span');
  if(pills[1]) pills[1].textContent = checked+'/'+total;
  if(pills[2]) pills[2].textContent = pct+'%';
}
function selectCond(opt, key){
  if(!state.completed[key]) state.completed[key] = {exChecked:[]};
  const prev = state.completed[key].condSelected;
  state.completed[key].condSelected = prev===opt ? null : opt;
  save();
  renderSessionDetail();
}
function markComplete(key, weekNum, dayNum){
  if(!state.completed[key]) state.completed[key] = {exChecked:[]};
  if(state.completed[key].completedAt) return;
  state.completed[key].completedAt = new Date().toISOString();
  const week = getWeek(weekNum);
  const day = week && week.days.find(d=>d.day===dayNum);
  const letters = ['A','B','C','D','E','F'];
  const di = week.days.findIndex(d=>d.day===dayNum);
  state.recentSessions.unshift({
    label: 'Session '+(letters[di]||'?')+' — '+(day?day.label:''),
    meta: 'Phase '+blockForWeek(weekNum).num+' · Week '+weekNum,
    time: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
  });
  if(state.recentSessions.length>10) state.recentSessions.pop();
  if(weekNum === state.currentWeek){
    const wk = getWeek(weekNum);
    const allDone = wk.days.every(d=>isSessionDone(weekNum,d.day));
    if(allDone && weekNum < 12) state.currentWeek = weekNum+1;
  }
  save();
  const btn = document.getElementById('markCompleteBtn');
  if(btn){btn.textContent='✓ Completed';btn.classList.add('done')}
}
function resetSession(key){
  delete state.completed[key];
  save();
  renderSessionDetail();
}

/* Programme */
function renderProgramme(){
  const phaseInfo = [
    {num:1,cls:'p1',name:'Foundation',wk:'1–4',desc:'Trap Bar Hinge Base · Barbell Press · Pull-Up Volume · Zone 2 Build · Loaded Carries'},
    {num:2,cls:'p2',name:'Build',wk:'5–8',desc:'Load Progression · Max Strength · Sandbag Shouldering · Interval Conditioning'},
    {num:3,cls:'p3',name:'Peak',wk:'9–12',desc:'Max Load · Near-1RM Strength · Full Output · Test Week · Benchmark Ruck'},
  ];
  document.getElementById('phaseCards').innerHTML = phaseInfo.map(p =>
    '<div class="phase-card '+p.cls+'" onclick="jumpToPhase('+p.num+')">' +
      '<div class="phase-num">'+p.num+'</div>' +
      '<div class="phase-info">' +
        '<div class="phase-eyebrow">// Phase '+p.num+'</div>' +
        '<div class="phase-name">'+p.name+'</div>' +
        '<div class="phase-desc">'+p.desc+'</div>' +
      '</div>' +
      '<div class="phase-wk">Wk<span>'+p.wk+'</span></div>' +
    '</div>'
  ).join('');
}
function jumpToPhase(num){
  state.viewingWeek = num===1?1:num===2?5:9;
  switchScreen('today');
}

/* Progress */
function renderProgress(){
  const done = doneSessions();
  const total = totalSessions();
  const streak = calcStreak();
  let exLogged = 0;
  Object.values(state.completed).forEach(e=>{exLogged += (e.exChecked||[]).length});

  document.getElementById('progressStats').innerHTML =
    '<div class="stat-tile"><div class="stat-label">Sessions Done</div><div class="stat-value">'+done+'</div><div class="stat-sub">of '+total+' total</div></div>' +
    '<div class="stat-tile"><div class="stat-label">Current Week</div><div class="stat-value">'+state.currentWeek+'</div><div class="stat-sub">of 12 weeks</div></div>' +
    '<div class="stat-tile"><div class="stat-label">Sets Logged</div><div class="stat-value">'+exLogged+'</div><div class="stat-sub">checked off</div></div>' +
    '<div class="stat-tile"><div class="stat-label">Week Streak</div><div class="stat-value">'+streak+'</div><div class="stat-sub">sessions this week</div></div>';

  document.getElementById('phaseProgressCards').innerHTML = [
    {num:1,label:'Phase 1 — Foundation',cls:'p1'},
    {num:2,label:'Phase 2 — Build',cls:'p2'},
    {num:3,label:'Phase 3 — Peak',cls:'p3'},
  ].map(p=>{
    const pct = phasePct(p.num);
    return '<div class="phase-prog-card">' +
      '<div class="phase-prog-header"><div class="phase-prog-name">'+p.label+'</div><div class="phase-prog-pct">'+pct+'%</div></div>' +
      '<div class="phase-prog-track"><div class="phase-prog-fill '+p.cls+'" style="width:'+pct+'%"></div></div>' +
    '</div>';
  }).join('');

  const recentHTML = state.recentSessions.length === 0
    ? '<div class="empty-state">No sessions logged yet.</div>'
    : state.recentSessions.map(s =>
        '<div class="recent-item">' +
          '<div class="recent-dot"></div>' +
          '<div class="recent-info"><div class="recent-name">'+s.label+'</div><div class="recent-meta">'+s.meta+'</div></div>' +
          '<div class="recent-time">'+s.time+'</div>' +
        '</div>'
      ).join('');
  document.getElementById('recentSessionsList').innerHTML = recentHTML;
}
function calcStreak(){
  const wk = getWeek(state.currentWeek);
  if(!wk) return 0;
  return wk.days.filter(d=>isSessionDone(state.currentWeek, d.day)).length;
}

/* Init */
load();
renderToday();

</script>
